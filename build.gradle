plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.coolie'
version = '0.0.1-SNAPSHOT'
description = 'Coolie Management System - Spring Boot Backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // -------------------------------------------------
    // ✅ Core Spring Boot Starters
    // -------------------------------------------------
    implementation 'org.springframework.boot:spring-boot-starter-web'          // Web + REST APIs
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'     // JPA + Hibernate ORM
    implementation 'org.springframework.boot:spring-boot-starter-validation'// Validation annotations (@NotNull, etc.)
    implementation 'com.h2database:h2'

    // -------------------------------------------------
    // ✅ Database
    // -------------------------------------------------
    runtimeOnly 'org.postgresql:postgresql'          // PostgreSQL driver (for Supabase)
    implementation 'com.zaxxer:HikariCP'             // Connection pooling

    // -------------------------------------------------
    // ✅ JSON and Date Handling
    // -------------------------------------------------
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // -------------------------------------------------
    // ✅ Security (optional, for login/auth modules)
    // -------------------------------------------------
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // -------------------------------------------------
    // ✅ Developer Tools
    // -------------------------------------------------
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // -------------------------------------------------
    // ✅ API Documentation (Swagger / OpenAPI)
    // -------------------------------------------------
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'


    // -------------------------------------------------
    // ✅ Lombok (reduces boilerplate code)
    // -------------------------------------------------
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // -------------------------------------------------
    // ✅ Testing
    // -------------------------------------------------
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
