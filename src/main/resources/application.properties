# ==============================================================
# ===============  SUPABASE DATABASE CONNECTION  ===============
# ==============================================================

spring.datasource.url=jdbc:postgresql://db.rmznhgrpqxkksoaeamhr.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=nYnDgd5HqyJKdwha
spring.datasource.driver-class-name=org.postgresql.Driver

# Enforce SSL (required by Supabase)
spring.datasource.hikari.data-source-properties.sslmode=require

# ==============================================================
# ===============  JPA / HIBERNATE CONFIGURATION  ===============
# ==============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
# ===============  SERVER / GENERAL SETTINGS  ==================
# ==============================================================

server.port=8080

# Optional: Allow React frontend requests
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# ==============================================================
# ===============  LOGGING SETTINGS  ===========================
# ==============================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
